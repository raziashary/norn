[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "norn-memory"
version = "0.1.0"
description = "Source-backed local canonical foundation for Norn memory research"
requires-python = ">=3.14,<3.15"
dependencies = ["tzdata>=2025.2"]

[project.scripts]
norn = "norn.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/norn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/norn"]
